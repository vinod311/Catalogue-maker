<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIVENKEM AGENCIES – Catalogue Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tk-style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body>
<header><div class="top">
<div class="brand serif">TRIVENKEM AGENCIES<small>Authorised Dealer of Givaudan · Catalogue Maker</small></div>
<button class="ghost" id="bSet">Company details</button></div>
<div class="top"><label class="search"><input id="q" type="search" placeholder="Search your products…"><span>🔍</span></label>
<button class="add" id="bNew">+ Add product</button></div></header>
<div class="tools"><button id="bAll">Select all</button><button id="bNone">Clear</button><span id="info"></span>
<span class="sp"></span><button id="bExp">Backup</button><label class="btnl">Restore<input type="file" id="bImp" accept=".json" hidden></label></div>
<main><div class="grid" id="grid"></div></main>
<div class="bottom"><div><b id="sel">0</b> selected<br><small id="parts">10 items per PDF</small></div><button class="pdf" id="bPdf">Create PDF</button></div>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="tk-app.js"></script>
</body></html>
