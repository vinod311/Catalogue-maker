<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header><div class="top"><div class="brand serif" id="brand"></div>
<label class="search"><input id="q" type="search" placeholder="Search perfumes, notes, codes…" aria-label="Search"><span>🔍</span></label>
<button class="enq" id="enq">My enquiry <b id="cnt">0</b></button></div></header>
<nav class="cats"><div id="cats"></div></nav>
<section class="hero"><div id="hero"></div></section>
<main><div class="bar"><span id="count"></span><select id="sort" aria-label="Sort"><option value="default">Sort: Featured</option><option value="lo">Price: Low to High</option><option value="hi">Price: High to Low</option></select></div>
<div class="grid" id="grid"></div></main>
<footer id="foot"></footer>
<a class="fab" id="fab" target="_blank" rel="noopener">WhatsApp us</a>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div id="toast" style="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;z-index:99;pointer-events:none"></div>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
